services:

  mongodb:
    image: mongo:8
    container_name: practice_mongodb
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db

  fastapi:
    build: .
    container_name: practice_fastapi
    ports:
      - "8000:8000"
    depends_on:
      - mongodb

volumes:
  mongodb_data: